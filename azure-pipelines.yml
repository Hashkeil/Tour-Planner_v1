# ============================================================
# Tour Planner — Azure Pipelines CI/CD
# ============================================================
# Required Azure DevOps setup (run infra/setup-azure.sh once):
#   • Variable Group : tour-planner-secrets  (Library → linked to Key Vault)
#   • Service Connection: tour-planner-acr-connection  (Docker Registry → ACR)
#   • Service Connection: tour-planner-azure-connection (Azure Resource Manager)
# ============================================================

trigger:
  branches:
    include:
      - master
  paths:
    exclude:
      - '*.md'
      - 'docs/**'
      - '.claude/**'

pr:
  branches:
    include:
      - master

# ── Non-secret variables (safe to put here) ──────────────────
variables:
  - name: ACR_LOGIN_SERVER
    value: 'tourplannercr.azurecr.io'
  - name: BACKEND_IMAGE
    value: 'tour-planner-backend'
  - name: FRONTEND_IMAGE
    value: 'tour-planner-frontend'
  - name: RESOURCE_GROUP
    value: 'tour-planner-rg'
  - name: JAVA_VERSION
    value: '17'
  - name: NODE_VERSION
    value: '20'
  # Secrets injected at runtime from Azure Key Vault — NEVER hard-coded here
  - group: tour-planner-secrets


# ============================================================
# STAGE 1 — BUILD & TEST
# ============================================================
stages:
- stage: CI
  displayName: 'Build & Test'
  jobs:

  # ── Backend: Maven build + unit tests ──────────────────────
  - job: BuildBackend
    displayName: 'Backend — Maven Build & Test'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: JavaToolInstaller@0
      displayName: 'Use Java $(JAVA_VERSION)'
      inputs:
        versionSpec:            '$(JAVA_VERSION)'
        jdkArchitectureOption:  'x64'
        jdkSourceOption:        'PreInstalled'

    - task: Maven@4
      displayName: 'mvn clean verify'
      inputs:
        mavenPomFile:         'tour-planner_backend/pom.xml'
        goals:                'clean verify'
        options:              '-B -q'
        publishJUnitResults:  true
        testResultsFiles:     '**/surefire-reports/TEST-*.xml'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish backend JAR'
      inputs:
        targetPath: 'tour-planner_backend/target'
        artifact:   'backend-jar'

  # ── Frontend: npm install + Angular production build ────────
  - job: BuildFrontend
    displayName: 'Frontend — npm Build'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node $(NODE_VERSION)'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - script: npm ci
      displayName: 'npm ci (clean install)'
      workingDirectory: 'tour-planner_frontend'

    - script: npm run build
      displayName: 'ng build --configuration=production'
      workingDirectory: 'tour-planner_frontend'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish frontend dist'
      inputs:
        targetPath: 'tour-planner_frontend/dist'
        artifact:   'frontend-dist'


# ============================================================
# STAGE 2 — IaC VALIDATION (Bicep)
# ============================================================
- stage: IaCValidate
  displayName: 'IaC — Validate Bicep Template'
  dependsOn: CI
  jobs:
  - job: ValidateBicep
    displayName: 'Bicep lint & what-if'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
        bicep --version
      displayName: 'Install Bicep CLI'

    - script: bicep lint infra/main.bicep
      displayName: 'bicep lint — check syntax & best practices'


# ============================================================
# STAGE 3 — DOCKER BUILD & PUSH TO AZURE CONTAINER REGISTRY
# ============================================================
- stage: DockerBuild
  displayName: 'Docker — Build & Push to ACR'
  dependsOn: IaCValidate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:

  - job: BuildAndPushImages
    displayName: 'Build & Push Docker Images'
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: Docker@2
      displayName: 'Build & push backend image'
      inputs:
        containerRegistry: 'tour-planner-acr-connection'
        repository:        '$(BACKEND_IMAGE)'
        command:           'buildAndPush'
        Dockerfile:        'tour-planner_backend/Dockerfile'
        buildContext:      'tour-planner_backend'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Build & push frontend image'
      inputs:
        containerRegistry: 'tour-planner-acr-connection'
        repository:        '$(FRONTEND_IMAGE)'
        command:           'buildAndPush'
        Dockerfile:        'tour-planner_frontend/Dockerfile'
        buildContext:      'tour-planner_frontend'
        tags: |
          $(Build.BuildId)
          latest

    - task: PublishPipelineArtifact@1
      displayName: 'Publish image tag'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact:   'image-tags'


# ============================================================
# STAGE 4 — RELEASE: DEPLOY TO AZURE CONTAINER APPS
# ============================================================
- stage: Deploy
  displayName: 'Release — Deploy to Azure Container Apps'
  dependsOn: DockerBuild
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:

  - deployment: DeployToProduction
    displayName: 'Deploy to Production Environment'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: 'Deploy backend → Container App'
            inputs:
              azureSubscription: 'tour-planner-azure-connection'
              scriptType:        'bash'
              scriptLocation:    'inlineScript'
              inlineScript: |
                set -euo pipefail

                echo "Deploying backend image: $(ACR_LOGIN_SERVER)/$(BACKEND_IMAGE):$(Build.BuildId)"

                az containerapp update \
                  --name          tour-planner-backend \
                  --resource-group $(RESOURCE_GROUP) \
                  --image         $(ACR_LOGIN_SERVER)/$(BACKEND_IMAGE):$(Build.BuildId) \
                  --set-env-vars \
                    SPRING_DATASOURCE_URL="jdbc:postgresql://tour-planner-db.postgres.database.azure.com:5432/tourplanner?sslmode=require" \
                    SPRING_DATASOURCE_USERNAME="$(DB-USER)" \
                    SPRING_DATASOURCE_PASSWORD="$(DB-PASSWORD)" \
                    SPRING_DATASOURCE_DRIVER_CLASS_NAME="org.postgresql.Driver" \
                    SPRING_JPA_DATABASE_PLATFORM="org.hibernate.dialect.PostgreSQLDialect" \
                    SPRING_JPA_HIBERNATE_DDL_AUTO="update" \
                    APP_JWT_SECRET="$(JWT-SECRET)" \
                    APP_JWT_EXPIRATION_MS="3600000" \
                    APP_ORS_BASE_URL="https://api.openrouteservice.org" \
                    APP_ORS_API_KEY="$(ORS-API-KEY)" \
                    APP_IMAGES_BASE_PATH="/app/images" \
                    SERVER_PORT="8081"

                az containerapp ingress update \
                  --name          tour-planner-backend \
                  --resource-group $(RESOURCE_GROUP) \
                  --target-port   8081 \
                  --type          external

                echo "Backend deployment complete."

          - task: AzureCLI@2
            displayName: 'Deploy frontend → Container App'
            inputs:
              azureSubscription: 'tour-planner-azure-connection'
              scriptType:        'bash'
              scriptLocation:    'inlineScript'
              inlineScript: |
                set -euo pipefail

                echo "Deploying frontend image: $(ACR_LOGIN_SERVER)/$(FRONTEND_IMAGE):$(Build.BuildId)"

                az containerapp update \
                  --name           tour-planner-frontend \
                  --resource-group $(RESOURCE_GROUP) \
                  --image          $(ACR_LOGIN_SERVER)/$(FRONTEND_IMAGE):$(Build.BuildId)

                echo "Frontend deployment complete."

          - task: AzureCLI@2
            displayName: 'Smoke test — backend health check'
            inputs:
              azureSubscription: 'tour-planner-azure-connection'
              scriptType:        'bash'
              scriptLocation:    'inlineScript'
              inlineScript: |
                set -euo pipefail

                BACKEND_FQDN=$(az containerapp show \
                  --name tour-planner-backend \
                  --resource-group $(RESOURCE_GROUP) \
                  --query properties.configuration.ingress.fqdn \
                  --output tsv)

                echo "Checking https://${BACKEND_FQDN}/actuator/health ..."
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                           --max-time 30 \
                           "https://${BACKEND_FQDN}/actuator/health")

                if [ "$STATUS" -ne 200 ]; then
                  echo "Health check FAILED with HTTP $STATUS"
                  exit 1
                fi
                echo "Health check passed (HTTP $STATUS)."
