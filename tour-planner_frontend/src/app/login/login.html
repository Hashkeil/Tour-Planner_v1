<div class="login-wrapper">
  <div class="login-container">

    <div class="login-left">
      <div class="login-badge">Welcome Back</div>
      <h1 class="login-title">Tour Planner</h1>
      <p class="login-subtitle">
        Continue your adventure and explore the world.
      </p>

      <div class="login-features">
        <div class="feature-item">
          <div class="feature-icon">+</div>
          <p>Plan & Organize Tours</p>
        </div>
        <div class="feature-item">
          <div class="feature-icon">+</div>
          <p>Manage Itineraries</p>
        </div>

      </div>
    </div>

    <div class="login-right">
      <div class="login-card">
        <h2 class="login-card-title">Sign In</h2>


        <form class="login-form" (ngSubmit)="onLogin()">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div *ngIf="message" class="message-box" [class.error]="message.includes('Invalid')">
          {{ message }}
        </div>

        <p class="register-link">
          Don't have an account? <a routerLink="/register">Create One</a>
        </p>
      </div>
    </div>

  </div>
</div>
