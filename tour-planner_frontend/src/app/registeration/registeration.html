<div class="register-wrapper">
  <div class="register-container">

    <div class="register-left">
      <div class="register-badge">Adventure Starts Here</div>
      <h1 class="register-title">Tour Planner</h1>
      <p class="register-subtitle">
        Plan your perfect journey with our comprehensive tour planning platform.
      </p>

      <div class="register-stats">
        <div class="stat-box">
          <h3>500K+</h3>
          <p>Active Travelers</p>
        </div>
        <div class="stat-box">
          <h3>10K+</h3>
          <p>Tours Planned</p>
        </div>
      </div>
    </div>

    <div class="register-right">
      <div class="register-card">
        <h2 class="register-card-title">Create Account</h2>

        <form class="register-form" (ngSubmit)="onRegister()" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" [(ngModel)]="username" placeholder="Enter your username">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="*******">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="*******">
          </div>

          <button type="submit" class="btn-register" [disabled]="loading">
            {{ loading ? 'Creating Account...' : 'Create Account' }}
          </button>
        </form>

        @if (message) {
          <div class="message-box error">
            {{ message }}
          </div>
        }

        <p class="login-link">
          Already have an account? <a routerLink="/login">Sign In</a>
        </p>
      </div>
    </div>

  </div>
</div>
