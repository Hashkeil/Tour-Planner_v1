<!-- Settings Component Template -->

<div class="page-content">
  <!-- Header -->
  <div class="page-header">
    <h1 class="font-display">
      <lucide-icon name="settings" [size]="24" style="margin-right:8px;vertical-align:middle"></lucide-icon>
      Settings
    </h1>
    <p class="page-subtitle">Manage your preferences and account settings</p>
  </div>

  <!-- Settings Grid -->
  <div class="settings-grid">
    <!-- Profile Settings Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">
          <lucide-icon name="user" [size]="16" style="margin-right:6px;vertical-align:middle"></lucide-icon>
          Profile Settings
        </h2>
      </div>
      <div class="card-body">
        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Username</span>
            <input
              type="text"
              class="form-control"
              placeholder="Your username"
              [(ngModel)]="profile.username"
            />
          </label>
        </div>

        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Email</span>
            <input
              type="email"
              class="form-control"
              [ngModel]="profile.email"
              disabled
            />
          </label>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveProfile()">Save Profile</button>
      </div>
    </div>

    <!-- Change Password Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">
          <lucide-icon name="lock" [size]="16" style="margin-right:6px;vertical-align:middle"></lucide-icon>
          Change Password
        </h2>
      </div>
      <div class="card-body">
        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Current Password</span>
            <input
              type="password"
              class="form-control"
              placeholder="*******"
              [(ngModel)]="passwordForm.currentPassword"
            />
          </label>
        </div>

        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">New Password</span>
            <input
              type="password"
              class="form-control"
              placeholder="*******"
              [(ngModel)]="passwordForm.newPassword"
            />
          </label>
        </div>

        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Confirm New Password</span>
            <input
              type="password"
              class="form-control"
              placeholder="*******"
              [(ngModel)]="passwordForm.confirmNewPassword"
            />
          </label>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="changePassword()">Change Password</button>
      </div>
    </div>

    <!-- Preferences Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">
          <lucide-icon name="palette" [size]="16" style="margin-right:6px;vertical-align:middle"></lucide-icon>
          Preferences
        </h2>
      </div>
      <div class="card-body">
        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Theme</span>
            <select
              class="form-control"
              [ngModel]="themeService.theme()"
              (ngModelChange)="setTheme($event)"
            >
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="auto">Auto (follow system)</option>
            </select>
          </label>
        </div>
      </div>
    </div>
  </div>

  @if (successMessage().length > 0) {
    <div class="alert alert-success" style="margin-top: 20px; animation: slideIn 0.3s ease">
      <lucide-icon name="circle-check" [size]="14" style="margin-right:4px;vertical-align:middle"></lucide-icon>
      {{ successMessage() }}
    </div>
  }

  @if (errorMessage().length > 0) {
    <div class="alert alert-danger" style="margin-top: 20px; animation: slideIn 0.3s ease">
      <lucide-icon name="triangle-alert" [size]="14" style="margin-right:4px;vertical-align:middle"></lucide-icon>
      {{ errorMessage() }}
    </div>
  }
</div>
