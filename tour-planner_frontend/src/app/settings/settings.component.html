<!-- Settings Component Template -->

<div class="page-content">
  <!-- Header -->
  <div class="page-header">
    <h1 class="font-display">⚙️ Settings</h1>
    <p class="page-subtitle">Manage your preferences and account settings</p>
  </div>

  <!-- Settings Grid -->
  <div class="settings-grid">
    <!-- Profile Settings Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">👤 Profile Settings</h2>
      </div>
      <div class="card-body">
        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Username</span>
            <input
              type="text"
              class="form-control"
              placeholder="Your username"
              [(ngModel)]="settings.username"
            />
          </label>
        </div>

        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Email</span>
            <input
              type="email"
              class="form-control"
              placeholder="your@email.com"
              [(ngModel)]="settings.email"
            />
          </label>
        </div>

        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Full Name</span>
            <input
              type="text"
              class="form-control"
              placeholder="Your full name"
              [(ngModel)]="settings.fullName"
            />
          </label>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="saveProfile()">Save Profile</button>
      </div>
    </div>

    <!-- Preferences Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">🎨 Preferences</h2>
      </div>
      <div class="card-body">
        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Theme</span>
            <select class="form-control" [(ngModel)]="settings.theme">
              <option value="light">☀️ Light</option>
              <option value="dark">🌙 Dark</option>
              <option value="auto">🔄 Auto</option>
            </select>
          </label>
        </div>

        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Distance Unit</span>
            <select class="form-control" [(ngModel)]="settings.distanceUnit">
              <option value="km">Kilometers (km)</option>
              <option value="mi">Miles (mi)</option>
            </select>
          </label>
        </div>

        <div class="settings-group">
          <label class="setting-label">
            <span class="label-text">Speed Unit</span>
            <select class="form-control" [(ngModel)]="settings.speedUnit">
              <option value="kmh">km/h</option>
              <option value="mph">mph</option>
              <option value="ms">m/s</option>
            </select>
          </label>
        </div>

        <div class="settings-group">
          <label class="toggle-label">
            <input
              type="checkbox"
              [(ngModel)]="settings.notifications"
              class="toggle-input"
            />
            <span class="toggle-text">📬 Enable notifications</span>
          </label>
        </div>

        <div class="settings-group">
          <label class="toggle-label">
            <input
              type="checkbox"
              [(ngModel)]="settings.publicProfile"
              class="toggle-input"
            />
            <span class="toggle-text">🌐 Public Profile</span>
          </label>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-primary" (click)="savePreferences()">Save Preferences</button>
      </div>
    </div>
  </div>

  <div *ngIf="successMessage().length > 0" class="alert alert-success" style="margin-top: 20px; animation: slideIn 0.3s ease">
    ✅ {{ successMessage() }}
  </div>

  <div *ngIf="errorMessage().length > 0" class="alert alert-danger" style="margin-top: 20px; animation: slideIn 0.3s ease">
    ❌ {{ errorMessage() }}
  </div>
</div>
