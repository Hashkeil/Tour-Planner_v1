services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       tourplanner
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d tourplanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./tour-planner_backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/tourplanner
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET:             ${JWT_SECRET}
      APP_ORS_API_KEY:            ${ORS_API_KEY}
      APP_IMAGES_BASE_PATH:       /app/images

  frontend:
    build:
      context: ./tour-planner_frontend
      dockerfile: Dockerfile
    ports:
      - "4201:80"
    depends_on:
      - backend

volumes:
  postgres_data:
